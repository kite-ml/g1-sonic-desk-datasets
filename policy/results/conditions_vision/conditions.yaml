# Vision conditions for the desk: each runs 100 episodes against the baseline, with the same apple and plate positions.
- {id: low_light, lighting: {intensity: [0.35, 0.6]}}
- {id: side_light, lighting: {shadows: true, direction_deg: [50, 80]}}
- {id: camera_turn, camera: {rotation_jitter_deg: 4.0}}
- {id: clutter, distractors: {count: [1, 3], size_m: [0.03, 0.06], region: {x: [0.55, 0.70], y: [-0.30, 0.10]}}}
- {id: state_noise, observation_noise: {state_sigma: 0.02}}
- {id: reworded, instruction: {phrasings: ["Put the apple on the plate.", "Move the red apple onto the blue plate."]}}
